services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: arrowfin
      POSTGRES_USER: arrowfin_owner
      POSTGRES_PASSWORD: owner_dev_password
      APP_DB_PASSWORD: app_dev_password
    ports:
      - '55432:5432'
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arrowfin_owner -d arrowfin']
      interval: 2s
      timeout: 3s
      retries: 20
